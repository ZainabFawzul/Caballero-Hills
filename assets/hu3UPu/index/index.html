<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Your Trail Quiz</title> <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Basic Reset & Body Styling for Embed */
        body {
            margin: 0;
            font-family: 'Public Sans', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #36150f;
            overflow: hidden;
        }

        /* Main Mobile Frame Container */
        .mobile-frame {
            width: 100%;
            max-width: 375px;
            min-height: 520px; /* Changed: Further reduced min-height */
            background-color: #fff;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            padding-bottom: 80px; /* Space for the fixed next button */
        }

        /* Top Bar/Header */
        .top-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px 20px;
            background-color: #fff;
            border-bottom: 1px solid #eee;
            position: relative;
            z-index: 10;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
        }

        .top-bar .title {
            font-family: 'Karla', sans-serif;
            font-weight: 600;
            color: #333;
            font-size: 17px;
        }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            height: 6px;
            background-color: #eee;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: #D65F02;
            border-radius: 3px;
            transition: width 0.3s ease-in-out;
        }

        /* Quiz Content Area */
        .quiz-content {
            flex-grow: 1;
            padding: 25px 20px; /* Kept for overall internal padding */
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            display: flex;
            flex-direction: column;
        }

        .quiz-intro-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
        }

        .quiz-title {
            font-size: 22px;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
            text-align: center;
        }

        .quiz-intro {
            font-size: 15px;
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            line-height: 1.4;
        }

        .question-screen {
            display: none;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .question-number {
            display: none;
        }

        .question-text {
            font-size: 18px;
            font-weight: 700;
            color: #333;
            margin-top: 15px;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .option-button {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            border: 1px solid #ddd;
            border-radius: 12px;
            background-color: #fff;
            cursor: pointer;
            transition: background-color 0.2s, border-color 0.2s, box-shadow 0.2s;
            font-size: 16px;
            color: #444;
            position: relative;
        }

        .option-button:hover {
            border-color: #f7d6c2;
        }

        .option-button.selected {
            background-color: #fff3eb;
            border-color: #D65F02;
            box-shadow: 0 4px 10px rgba(214, 95, 2, 0.1);
            color: #D65F02;
        }

        .option-button .circle {
            width: 20px;
            height: 20px;
            border: 2px solid #ccc;
            border-radius: 50%;
            margin-right: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            transition: border-color 0.2s;
            overflow: hidden;
        }

        .option-button.selected .circle {
            border-color: #D65F02;
            background-color: #D65F02;
        }

        .option-button.selected .circle .fa-check {
            color: white;
            font-size: 12px;
        }

        /* Question Icon */
        .question-icon {
            text-align: center;
            margin-top: 10px;
            margin-bottom: 20px;
            color: #4D4318;
            font-size: 55px;
            opacity: 0.7;
            transition: opacity 0.3s ease-in-out;
        }

        /* Next Button */
        .next-button-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            background: linear-gradient(to top, rgba(255,255,255,1) 70%, rgba(255,255,255,0));
            z-index: 5;
            box-sizing: border-box;
        }

        .next-button {
            width: 100%;
            padding: 15px 20px;
            background-color: #D65F02;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s, opacity 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            font-family: 'Karla', sans-serif;
        }

        .next-button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
            opacity: 0.7;
        }

        /* Results Screen */
        .results-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            text-align: center;
            flex-grow: 1;
            padding: 10px 20px 20px 20px; /* Changed: Reduced top padding for tighter gap */
        }

        /* Removed: h2 for "Your Trail Recommendation:" */

        .results-screen .results-intro-text {
            font-size: 16px;
            color: #666;
            margin-bottom: 10px; /* Keep this tight */
            line-height: 1.4;
        }

        .results-screen .trail-name {
            font-size: 28px;
            font-weight: bold;
            color: #D65F02;
            margin-top: 5px;
            margin-bottom: 15px;
        }

        .results-screen .trail-description {
            font-size: 15px;
            color: #555;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .results-screen .trail-stats {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 60px; /* Changed: Increased margin to push button down */
            width: 100%;
            max-width: 250px;
            align-items: center; /* Changed: Center stat-items horizontally within trail-stats */
        }

        .results-screen .stat-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 16px;
            color: #444;
            justify-content: center; /* Changed: Center icon and text within each stat-item */
        }

        .results-screen .stat-item i {
            color: #D65F02;
            font-size: 18px;
        }

        .results-screen .start-over-button {
            background-color: #666;
            color: #fff;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 0; /* Keep this at 0 as margin-bottom on trail-stats pushes it */
            transition: background-color 0.3s;
        }

        .results-screen .start-over-button:hover {
            background-color: #555;
        }
    </style>
</head>
<body>

    <div class="mobile-frame">
        <div class="top-bar">
            <div class="title" id="topBarTitle"></div>
        </div>
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="quiz-content" id="quizContent">
            <div class="quiz-intro-screen">
                <h1 class="quiz-title">🧭 Find Your Trail</h1>
                <p class="quiz-intro">Answer a few quick questions to get your best match.</p>
            </div>

            <div class="question-screen" style="display: none;">
                <div class="question-icon" id="questionIcon"></div>
                <div class="question-number" id="questionNumber"></div>
                <div class="question-text" id="questionText"></div>
                <div class="options-container" id="optionsContainer">
                </div>
            </div>
        </div>

        <div class="results-screen" id="resultsScreen">
            <p id="resultsIntro" class="results-intro-text">Based on your responses, we recommend:</p>
            <p class="trail-name" id="recommendedTrail"></p>
            <p id="trailDescription" class="trail-description"></p>
            <div id="trailStats" class="trail-stats">
            </div>
            <button class="start-over-button" onclick="startOver()">Start Over</button>
        </div>

        <div class="next-button-container">
            <button class="next-button" id="nextButton" disabled>
                Next &rightarrow;
            </button>
        </div>
    </div>

    <script>
        const questions = [
            {
                questionText: "How much hiking experience do you have?",
                options: [
                    { text: "I’m new to hiking and take it slow", symbol: "🟢" },
                    { text: "I’ve done a few hikes and feel comfortable outdoors", symbol: "🐾" },
                    { text: "I hike often and enjoy a tough challenge", symbol: "🦅" }
                ],
                iconClass: "fa-solid fa-person-hiking"
            },
            {
                questionText: "Who are you hiking with today?",
                options: [
                    { text: "I’m with kids or family", symbol: "🐾" },
                    { text: "I’m with a friend or partner", symbol: "🟢" },
                    { text: "I’m hiking solo or with experienced hikers", symbol: "🦅" }
                ],
                iconClass: "fa-solid fa-users"
            },
            {
                questionText: "How much water are you carrying?",
                options: [
                    { text: "I brought 1-2 quarts", symbol: "🟢" },
                    { text: "I packed around 2-3 quarts", symbol: "🐾" },
                    { text: "I’ve got over 4 quarts and refill options", symbol: "🦅" }
                ],
                iconClass: "fa-solid fa-droplet" // Changed: Universal water drop icon
            },
            {
                questionText: "What kind of terrain are you looking for?",
                options: [
                    { text: "I want something flat and easy", symbol: "🟢" },
                    { text: "I’m good with a few hills and turns", symbol: "🐾" },
                    { text: "I’m ready for steep climbs and rocky trails", symbol: "🦅" }
                ],
                iconClass: "fa-solid fa-mountain"
            },
            {
                questionText: "How long do you plan to hike?",
                options: [
                    { text: "I want something around an hour", symbol: "🟢" },
                    { text: "I’ve got 1–2 hours to explore", symbol: "🐾" },
                    { text: "I’m aiming for 3+ hours of hiking", symbol: "🦅" }
                ],
                iconClass: "fa-solid fa-hourglass-half"
            },
            {
                questionText: "How do you feel about heat and exposure?",
                options: [
                    { text: "I’d prefer shade and a short walk", symbol: "🟢" },
                    { text: "I can handle some sun", symbol: "🐾" },
                    { text: "I’m prepared for full sun and no shade", symbol: "🦅" }
                ],
                iconClass: "fa-solid fa-sun"
            },
            {
                questionText: "How prepared are you for trail safety?",
                options: [
                    { text: "I’m learning as I go", symbol: "🟢" },
                    { text: "I know the basics like snakes and cacti", symbol: "🐾" },
                    { text: "I’m confident with desert safety and emergencies", symbol: "🦅" }
                ],
                iconClass: "fa-solid fa-triangle-exclamation" // Hazard icon
            },
            {
                questionText: "What kind of experience do you want?",
                options: [
                    { text: "I want it chill, scenic, and easy", symbol: "🟢" },
                    { text: "I’m here for fun and adventure", symbol: "🐾" },
                    { text: "I want to push myself and earn the view", symbol: "🦅" }
                ],
                iconClass: "fa-solid fa-binoculars"
            }
        ];

        const trailDetails = {
            "Sundance Loop": {
                description: "A short, gentle trail with wide paths and plenty of desert charm. Perfect for new hikers, solo strolls, and easy mornings.",
                miles: "1-2.5 miles",
                time: "1 hour hike",
                mileIcon: "fa-solid fa-shoe-prints",
                timeIcon: "fa-solid fa-clock"
            },
            "Coyote Crush": {
                description: "A fun, varied trail with just the right mix of sun, shade, and views. Great for families, small groups, and curious explorers of all ages.",
                miles: "2.5-3 miles",
                time: "1.5 hour hike",
                mileIcon: "fa-solid fa-shoe-prints",
                timeIcon: "fa-solid fa-clock"
            },
            "Hawkspur": {
                description: "A rugged trail with elevation, exposure, and serious payoff. Ideal for experienced hikers chasing solitude and sweeping views.",
                miles: "5+ miles",
                time: "3+ hour hike",
                mileIcon: "fa-solid fa-shoe-prints",
                timeIcon: "fa-solid fa-clock"
            }
        };

        let currentQuestionIndex = -1;
        let userSelections = new Array(questions.length).fill(null);

        const quizIntroScreen = document.querySelector('.quiz-intro-screen');
        const questionScreen = document.querySelector('.question-screen');
        const resultsScreen = document.getElementById('resultsScreen');
        const questionTextElem = document.getElementById('questionText');
        const optionsContainer = document.getElementById('optionsContainer');
        const progressBar = document.getElementById('progressBar');
        const nextButton = document.getElementById('nextButton');
        const recommendedTrailElem = document.getElementById('recommendedTrail');
        const topBarTitle = document.getElementById('topBarTitle');
        const questionIconElem = document.getElementById('questionIcon');

        const resultsIntro = document.getElementById('resultsIntro');
        const trailDescriptionElem = document.getElementById('trailDescription');
        const trailStatsElem = document.getElementById('trailStats');

        function updateProgressBar() {
            const progress = (currentQuestionIndex + 1) / questions.length * 100;
            progressBar.style.width = `${progress}%`;
        }

        function displayQuestion() {
            if (currentQuestionIndex >= 0 && currentQuestionIndex < questions.length) {
                quizIntroScreen.style.display = 'none';
                questionScreen.style.display = 'flex';
                resultsScreen.style.display = 'none';
                nextButton.style.display = 'flex';

                const question = questions[currentQuestionIndex];
                topBarTitle.textContent = `Question ${currentQuestionIndex + 1} of ${questions.length}`;
                questionTextElem.textContent = question.questionText;
                optionsContainer.innerHTML = '';

                question.options.forEach((option, index) => {
                    const button = document.createElement('div');
                    button.classList.add('option-button');
                    button.innerHTML = `<div class="circle"></div><span>${option.text}</span>`;
                    button.dataset.index = index;
                    button.dataset.symbol = option.symbol;

                    button.addEventListener('click', () => selectAnswer(index, option.symbol));

                    if (userSelections[currentQuestionIndex] === option.symbol) {
                        button.classList.add('selected');
                        const circle = button.querySelector('.circle');
                        circle.innerHTML = '<i class="fa-solid fa-check"></i>';
                    }
                    optionsContainer.appendChild(button);
                });

                questionIconElem.innerHTML = `<i class="${question.iconClass}"></i>`;

                nextButton.disabled = userSelections[currentQuestionIndex] === null;
                updateProgressBar();
            } else if (currentQuestionIndex === -1) {
                quizIntroScreen.style.display = 'flex';
                questionScreen.style.display = 'none';
                resultsScreen.style.display = 'none';
                nextButton.style.display = 'flex';
                nextButton.disabled = false;
                nextButton.innerHTML = 'Start Quiz &rightarrow;';
                progressBar.style.width = '0%';
                topBarTitle.textContent = 'Find Your Trail';
                questionIconElem.innerHTML = '';
            }
        }

        function selectAnswer(optionIndex, symbol) {
            Array.from(optionsContainer.children).forEach(button => {
                button.classList.remove('selected');
                const circle = button.querySelector('.circle');
                circle.innerHTML = '';
            });

            userSelections[currentQuestionIndex] = symbol;
            const selectedButton = optionsContainer.children[optionIndex];
            selectedButton.classList.add('selected');
            const selectedCircle = selectedButton.querySelector('.circle');
            selectedCircle.innerHTML = '<i class="fa-solid fa-check"></i>';

            nextButton.disabled = false;
        }

        function showResults() {
            quizIntroScreen.style.display = 'none';
            questionScreen.style.display = 'none';
            resultsScreen.style.display = 'flex';
            nextButton.style.display = 'none';
            topBarTitle.textContent = 'Your Trail';
            questionIconElem.innerHTML = '';

            const symbolCounts = {
                '🟢': 0,
                '🐾': 0,
                '🦅': 0
            };

            userSelections.forEach(symbol => {
                if (symbolCounts.hasOwnProperty(symbol)) {
                    symbolCounts[symbol]++;
                }
            });

            let recommendedTrailName = '';
            if (symbolCounts['🟢'] > symbolCounts['🐾'] && symbolCounts['🟢'] > symbolCounts['🦅']) {
                recommendedTrailName = 'Sundance Loop';
            } else if (symbolCounts['🐾'] >= symbolCounts['🟢'] && symbolCounts['🐾'] >= symbolCounts['🦅']) {
                recommendedTrailName = 'Coyote Crush';
            } else {
                recommendedTrailName = 'Hawkspur';
            }

            const trail = trailDetails[recommendedTrailName];

            recommendedTrailElem.textContent = recommendedTrailName;
            trailDescriptionElem.textContent = trail.description;

            trailStatsElem.innerHTML = '';

            const mileStat = document.createElement('div');
            mileStat.classList.add('stat-item');
            mileStat.innerHTML = `<i class="${trail.mileIcon}"></i> <span>${trail.miles}</span>`;
            trailStatsElem.appendChild(mileStat);

            const timeStat = document.createElement('div');
            timeStat.classList.add('stat-item');
            timeStat.innerHTML = `<i class="${trail.timeIcon}"></i> <span>${trail.time}</span>`;
            trailStatsElem.appendChild(timeStat);

            // New: Save result to local storage
            localStorage.setItem('userTrailRecommendation', recommendedTrailName);
            console.log('Trail recommendation saved to localStorage:', recommendedTrailName); // For debugging purposes
        }

        function goNext() {
            if (currentQuestionIndex === -1) {
                currentQuestionIndex = 0;
                nextButton.innerHTML = 'Next &rightarrow;';
                displayQuestion();
            } else if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                displayQuestion();
            } else if (currentQuestionIndex === questions.length - 1) {
                showResults();
            }
        }

        function startOver() {
            currentQuestionIndex = -1;
            userSelections.fill(null);
            displayQuestion();
        }

        nextButton.addEventListener('click', goNext);
        displayQuestion();
    </script>
